    /** Wrap degrees into [0, 360). */
    function wrap360(x) {
      x %= 360;
      return x < 0 ? x + 360 : x;
    }

    /** Julian day from a Date. */
    function julianDay(date) {
      return date.getTime() / 86400000 + 2440587.5;

    /** Local sidereal time in hours for observer longitude. */
    function siderealHours(jd, lonDeg) {
      const T = (jd - 2451545.0) / 36525;
      let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
        + 0.000387933 * T * T - (T * T * T) / 38710000;
      return wrap360(gmst + lonDeg) / 15;
    }

    /** Solve Kepler's equation (eccentric anomaly, radians). */
    function kepler(M, e) {
      let E = M + e * Math.sin(M);
      for (let i = 0; i < 8; i++) {
        const d = E - e * Math.sin(E) - M;
        E -= d / (1 - e * Math.cos(E));
      }
      return E;
    }

    /**
     * Low-precision heliocentric ecliptic XYZ (AU) from JPL-style elements.
     * Good enough for naked-eye planet places on the dock.
     */
    function planetHelio(jd, el) {
      const T = (jd - 2451545.0) / 36525;
      const a = el.a + el.da * T;
      const e = el.e + el.de * T;
      const I = (el.I + el.dI * T) * DEG;
      const L = wrap360(el.L + el.dL * T) * DEG;
      const wbar = wrap360(el.wbar + el.dwbar * T) * DEG;
      const O = wrap360(el.O + el.dO * T) * DEG;
      const M = ((L - wbar + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      const E = kepler(M, e);
      const x = a * (Math.cos(E) - e);
      const y = a * Math.sqrt(1 - e * e) * Math.sin(E);
      const w = wbar - O;
      const cosO = Math.cos(O), sinO = Math.sin(O);
      const cosI = Math.cos(I), sinI = Math.sin(I);
      const cosw = Math.cos(w), sinw = Math.sin(w);
      const xh = (cosw * cosO - sinw * sinO * cosI) * x
        + (-sinw * cosO - cosw * sinO * cosI) * y;
      const yh = (cosw * sinO + sinw * cosO * cosI) * x
        + (-sinw * sinO + cosw * cosO * cosI) * y;
      const zh = (sinw * sinI) * x + (cosw * sinI) * y;
      return { x: xh, y: yh, z: zh };
    }

    /** Ecliptic lon/lat (deg) + distance → equatorial RA hours, Dec deg. */
    function eclipticToRaDec(lonDeg, latDeg, dist) {
      const eps = 23.439291 * DEG;
      const b = latDeg * DEG, l = lonDeg * DEG;
      const x = dist * Math.cos(b) * Math.cos(l);
      const y = dist * Math.cos(b) * Math.sin(l);
      const z = dist * Math.sin(b);
      const ye = y * Math.cos(eps) - z * Math.sin(eps);
      const ze = y * Math.sin(eps) + z * Math.cos(eps);
      let ra = Math.atan2(ye, x);
      if (ra < 0) ra += Math.PI * 2;
      return { ra: ra / DEG / 15, d: Math.asin(ze / dist) / DEG };
    }

      mercury: { n: "Mercury", color: "#c8c2b4", glow: "rgba(200,190,170,0.35)", r: 3.2, m: 0.0 },
      venus:   { n: "Venus",   color: "#f2e6c4", glow: "rgba(242,220,150,0.45)", r: 5.0, m: -4.0 },
      mars:    { n: "Mars",    color: "#e07050", glow: "rgba(220,100,70,0.4)",  r: 4.0, m: 0.8 },
      jupiter: { n: "Jupiter", color: "#e8d5a8", glow: "rgba(230,200,140,0.4)", r: 5.5, m: -2.2 },
      saturn:  { n: "Saturn",  color: "#dcc89a", glow: "rgba(210,190,140,0.35)", r: 4.5, m: 0.5 }
    };

    /** Geocentric RA/Dec for Moon (Meeus-ish low precision) and phase 0..1. */
    function moonEquatorial(jd) {
      const d = jd - 2451545.0;
      const Lp = wrap360(218.316 + 13.176396 * d);
      const M = wrap360(134.963 + 13.064993 * d) * DEG;
      const F = wrap360(93.272 + 13.229350 * d) * DEG;
      const lon = wrap360(Lp + 6.289 * Math.sin(M));
      const lat = 5.128 * Math.sin(F);
      const dist = 385001 - 20905 * Math.cos(M);
      const eq = eclipticToRaDec(lon, lat, dist / 149597870.7);
      const sunLon = wrap360(280.460 + 0.9856474 * d);
      let elong = wrap360(lon - sunLon);
      if (elong > 180) elong -= 360;
      const phase = 0.5 * (1 - Math.cos(elong * DEG)); // 0 new … 1 full
      const waxing = elong > 0;
      return { ...eq, phase, waxing, lon };
    }

    /** Refresh LST and solar-system body list for "now". */
    function updateEphemeris() {
      const jd = julianDay(new Date());
      lst = siderealHours(jd, LON);
      const earth = planetHelio(jd, ORBITS.earth);
      const bodies = [];
      for (const id of Object.keys(PLANET_DRAW)) {
        const hxyz = planetHelio(jd, ORBITS[id]);
        const x = hxyz.x - earth.x;
        const y = hxyz.y - earth.y;
        const z = hxyz.z - earth.z;
        const dist = Math.sqrt(x * x + y * y + z * z);
        const lon = wrap360(Math.atan2(y, x) / DEG);
        const lat = Math.asin(z / dist) / DEG;
        const eq = eclipticToRaDec(lon, lat, dist);
        const meta = PLANET_DRAW[id];
        bodies.push({
          id, kind: "planet", n: meta.n, ra: eq.ra, d: eq.d,
          color: meta.color, glow: meta.glow, r: meta.r, m: meta.m
        });
      }
      const moon = moonEquatorial(jd);
      bodies.push({
        id: "moon", kind: "moon", n: "Moon",
        ra: moon.ra, d: moon.d, phase: moon.phase, waxing: moon.waxing,
        color: "#e8e0cc", glow: "rgba(230,220,200,0.35)", r: 9, m: -12
      });
      solarBodies = bodies;
    }

    /** Draw Moon with a simple phase crescent. */
    function drawMoon(x, y, r, phase, waxing) {
      ctx.beginPath();
      ctx.fillStyle = "rgba(230, 220, 200, 0.2)";
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = "#d8d0bc";
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      // Dark limb: phase 0 = new (fully dark), 1 = full (no dark)
      const dark = 1 - phase;
      if (dark > 0.02) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r + 0.5, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = "#0a0c14";
        const dir = waxing ? 1 : -1;
        // Offset disk covers the unlit portion
        const ox = dir * (1 - 2 * phase) * r * 1.05;
        ctx.beginPath();
        ctx.arc(x + ox, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.strokeStyle = "rgba(240, 230, 210, 0.55)";
      ctx.lineWidth = 1;
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    /** Draw a labeled planet disc with soft glow. */
    function drawPlanet(body, x, y) {
      ctx.beginPath();
      ctx.fillStyle = body.glow;
      ctx.arc(x, y, body.r + 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = body.color;
      ctx.arc(x, y, body.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(230, 220, 200, 0.9)";
      ctx.font = "11px Consolas, monospace";
      ctx.fillText(body.n, x + body.r + 5, y + 3);
    }

    /** Footer height in CSS pixels. */
    function readFooterPx() {
      const raw = getComputedStyle(document.documentElement).getPropertyValue("--footer-h");
      const probe = document.createElement("div");
      probe.style.cssText = "position:absolute;visibility:hidden;height:" + raw;
      document.body.appendChild(probe);
      footerPx = probe.offsetHeight || 56;
      probe.remove();
    }

    /**
     * Pitch that places the horizon on the footer seam.
     * Looking lower than this is blocked; looking up is free.
     */
    function pitchForFooterHorizon() {
      const targetY = h - footerPx;
      const saved = pitch;
      let lo = 0.05, hi = 1.15;
      for (let i = 0; i < 24; i++) {
        pitch = (lo + hi) / 2;
        const p = project(0, yaw, 0.01);
        if (!p) { hi = pitch; continue; }
        if (p.y < targetY) lo = pitch;
        else hi = pitch;
      }
      const found = (lo + hi) / 2;
      pitch = saved;
      return found;
    }

    /** Refresh the downward clamp; keep current look if still legal. */
    function refreshPitchClamp() {
      minPitch = pitchForFooterHorizon();
      pitch = Math.max(minPitch, Math.min(1.25, pitch));
    }

    /** Resize canvas and refresh pitch limits. */
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      readFooterPx();
      refreshPitchClamp();
      draw();
    }

    /**
     * Equatorial (RA hours, Dec deg) → horizontal (alt, az rad).
     * Azimuth: 0 north, positive toward east.
     */
    function toAltAz(raHours, decDeg) {
      const ra = raHours * 15 * Math.PI / 180;
      const dec = decDeg * Math.PI / 180;
      const lstR = lst * 15 * Math.PI / 180;
      const lat = LAT * Math.PI / 180;
      const ha = lstR - ra;
      const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
      const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
      const cosAlt = Math.max(1e-6, Math.cos(alt));
      const sinAz = (-Math.cos(dec) * Math.sin(ha)) / cosAlt;
      const cosAz = (Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(ha)) / cosAlt;
      let az = Math.atan2(sinAz, cosAz);
      if (az < 0) az += Math.PI * 2;
      return { alt, az };
    }

    /** Project horizontal coords into screen space. */
    function project(alt, az, minForward) {
      const minF = minForward == null ? 0.08 : minForward;
      const ca = Math.cos(alt), sa = Math.sin(alt);
      const vx = ca * Math.sin(az);
      const vy = ca * Math.cos(az);
      const vz = sa;

      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const fx = cp * sy, fy = cp * cy, fz = sp;
      const rx = cy, ry = -sy;
      const ux = -sp * sy, uy = -sp * cy, uz = cp;

      const forward = vx * fx + vy * fy + vz * fz;
      if (forward < minF) return null;
      const right = vx * rx + vy * ry;
      const up = vx * ux + vy * uy + vz * uz;
      const scale = Math.min(w, h - footerPx) * 0.62 / Math.tan(FOV / 2);
      return {
        x: w / 2 + (right / forward) * scale,
        y: (h - footerPx) / 2 - (up / forward) * scale,
        forward
      };
    }

    /** Compass label for current yaw. */
    function bearingName(rad) {
      const deg = ((rad * 180 / Math.PI) % 360 + 360) % 360;
      const names = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
                     "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
      return names[Math.round(deg / 22.5) % 16] + " · " + deg.toFixed(0) + "°";
    }

    function draw() {
      updateEphemeris();
      const skyH = h - footerPx;
      const sky = ctx.createLinearGradient(0, 0, 0, skyH);
      sky.addColorStop(0, "#070a14");
      sky.addColorStop(0.55, "#0a0e1a");
      sky.addColorStop(1, "#0d1220");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // Soft fade into the footer seam — not sea, just night ending
      const fade = ctx.createLinearGradient(0, skyH - 48, 0, h);
      fade.addColorStop(0, "rgba(7, 8, 12, 0)");
      fade.addColorStop(0.55, "rgba(7, 8, 12, 0.55)");
      fade.addColorStop(1, "#07080c");
      ctx.fillStyle = fade;
      ctx.fillRect(0, skyH - 48, w, h - (skyH - 48));

      const pos = {};
      for (const id of Object.keys(STARS)) {
        const s = STARS[id];
        const { alt, az } = toAltAz(s.ra, s.d);
        if (alt < 0.01) continue;
        const p = project(alt, az);
        if (!p || p.y > skyH - 2) continue;
        pos[id] = { ...p, alt, star: s };
      }

      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(150, 165, 220, 0.28)";
      for (const [a, b] of LINES) {
        const pa = pos[a], pb = pos[b];
        if (!pa || !pb) continue;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      if (pos.merak && pos.dubhe) {
        ctx.strokeStyle = "rgba(107, 124, 255, 0.45)";
        ctx.setLineDash([4, 5]);
        ctx.beginPath();
        ctx.moveTo(pos.merak.x, pos.merak.y);
        ctx.lineTo(pos.dubhe.x, pos.dubhe.y);
        const dx = pos.dubhe.x - pos.merak.x;
        const dy = pos.dubhe.y - pos.merak.y;
        ctx.lineTo(pos.dubhe.x + dx * 4.5, pos.dubhe.y + dy * 4.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      for (const id of Object.keys(pos)) {
        const p = pos[id];
        const s = p.star;
        const r = Math.max(0.6, 3.6 - s.m * 0.85);
        const alpha = Math.max(0.35, 1 - s.m * 0.12);
        ctx.beginPath();
        ctx.fillStyle = s.nav
          ? `rgba(220, 230, 255, ${alpha})`
          : `rgba(200, 210, 240, ${alpha * 0.9})`;
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        if (s.nav || s.m < 1.3) {
          ctx.fillStyle = "rgba(180, 190, 230, 0.75)";
          ctx.font = "11px Consolas, monospace";
          ctx.fillText(s.n, p.x + r + 4, p.y + 3);
        }
      }

      for (const body of solarBodies) {
        const { alt, az } = toAltAz(body.ra, body.d);
        if (alt < 0.01) continue;
        const p = project(alt, az);
        if (!p || p.y > skyH - 2) continue;
        if (body.kind === "moon") drawMoon(p.x, p.y, body.r, body.phase, body.waxing);
        else drawPlanet(body, p.x, p.y);
        ctx.fillStyle = "rgba(230, 220, 200, 0.9)";
        ctx.font = "11px Consolas, monospace";
        if (body.kind === "moon") ctx.fillText(body.n, p.x + body.r + 5, p.y + 3);
      }

      bearingEl.textContent = bearingName(yaw);
    }

    stowBtn.addEventListener("click", () => {
      const stowed = document.body.classList.toggle("stowed");
      stowBtn.textContent = stowed ? "nav" : "hide";
      stowBtn.setAttribute("aria-expanded", stowed ? "false" : "true");
    });

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      yaw = (yaw - dx * 0.0045 + Math.PI * 2) % (Math.PI * 2);
      minPitch = pitchForFooterHorizon();
      pitch = Math.max(minPitch, Math.min(1.25, pitch + dy * 0.0035));
      draw();
    });
    function endDrag(e) {
      dragging = false;
      canvas.classList.remove("dragging");
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    window.addEventListener("resize", resize);
    resize();
    setInterval(() => { if (!dragging) draw(); }, 60000);
  </script>
</body>
</html>
